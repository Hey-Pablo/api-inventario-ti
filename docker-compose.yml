services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: inventario-ti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: inventario_password
      POSTGRES_DB: inventario
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario -d inventario"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventario-ti-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://inventario:inventario_password@postgres:5432/inventario?schema=public
      JWT_SECRET: substitua-esta-chave-por-uma-aleatoria-com-32-caracteres
      PORT: 3000
    ports:
      - '3000:3000'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local